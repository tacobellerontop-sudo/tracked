name: Windows build

# Every push builds tracked.exe and uploads it as a workflow artifact.
# Pushing a tag like v0.1.0, or running it by hand with a version, also
# publishes a GitHub Release (the tag is created on the built commit).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tracked.exe dist/
          Copy-Item target/release/riot-probe.exe dist/
          Copy-Item target/release/mock-backend.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath tracked-windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracked-windows-x64
          path: |
            dist/tracked.exe
            dist/riot-probe.exe
            dist/mock-backend.exe
            dist/README.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Tracked ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            tracked-windows-x64.zip
            dist/tracked.exe
          generate_release_notes: true
