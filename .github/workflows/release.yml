name: Windows build

# Every push builds ascend-lite.exe and uploads it as a workflow artifact.
# Pushing a tag like v0.1.0 also publishes it as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ascend-lite.exe dist/
          Copy-Item target/release/riot-probe.exe dist/
          Copy-Item target/release/mock-backend.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ascend-lite-windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend-lite-windows-x64
          path: |
            dist/ascend-lite.exe
            dist/riot-probe.exe
            dist/mock-backend.exe
            dist/README.md
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ascend-lite-windows-x64.zip
            dist/ascend-lite.exe
          generate_release_notes: true
