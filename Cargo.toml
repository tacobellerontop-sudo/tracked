[workspace]
members = [".", "mock-backend"]
resolver = "2"

[package]
name = "tracked"
version = "0.3.2"
edition = "2021"
description = "Lightweight, unofficial VALORANT companion (Riot local API + egui)"
license = "MIT"
publish = false

[lib]
name = "tracked"
path = "src/lib.rs"

[[bin]]
name = "tracked"
path = "src/main.rs"

[[bin]]
name = "riot-probe"
path = "src/bin/riot-probe.rs"

[features]
default = []
# Dev/test only: lets TRACKED_FAKE_RIOT_BASE=https://127.0.0.1:<port> stand in
# for Riot's PD/GLZ hosts so the whole worker can be tested end to end.
# Never enable this in release builds.
fake-riot = []

[[test]]
name = "e2e_worker"
required-features = ["fake-riot"]

[[test]]
name = "riot_layer"
required-features = ["fake-riot"]

# Runs the presence watcher, which looks up match ids on GLZ; with the fake
# backend those calls stay on loopback instead of reaching Riot.
[[test]]
name = "no_secrets_in_logs"
required-features = ["fake-riot"]

[dependencies]
# Rendering: wgpu (Direct3D 12 / Vulkan / Metal) by default, OpenGL (glow) as
# a fallback for machines where wgpu can't start.
eframe = { version = "0.31", features = ["wgpu"] }
egui-phosphor = "0.9"
egui = "0.31"
egui_extras = { version = "0.31", features = ["file", "http", "image"] }
# Decompresses Oodle (Mermaid) blocks in VALORANT's downloaded replay files.
oozextract = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
regex = "1"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
semver = "1"
webpki-roots = "0.26"

# Windows only: system TLS (schannel) fallback for the Riot Client's local
# server, used if rustls can't complete the handshake with it.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Only to style our own window (rounded corners + shadow on Windows 11).
# Never used to touch any other process.
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[dev-dependencies]
mock-backend = { path = "mock-backend" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Line tables keep backtraces useful at a fraction of the size of full
# debug info (dozens of test binaries otherwise add up to tens of GB).
[profile.dev]
debug = "line-tables-only"
